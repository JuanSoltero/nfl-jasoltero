<style>
:root{
  --navy:#0B1D3A;
  --navy-2:#122a52;
  --navy-3:#17335f;
  --card:rgba(255,255,255,0.045);
  --card-border:rgba(255,255,255,0.09);
  --gold:#FFD700;
  --gold-dim:#c9ad2e;
  --red:#E63946;
  --text:#F3F5F9;
  --muted:#94A0B8;
  --green:#2ecc71;
  --radius:16px;
  --maxw:480px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 90% 8%, rgba(230,57,70,0.18) 0%, transparent 40%),
    radial-gradient(circle at 6% 85%, rgba(230,57,70,0.10) 0%, transparent 35%),
    radial-gradient(circle at 50% 0%, var(--navy-3) 0%, var(--navy) 55%, #060f21 100%);
  color:var(--text);
  font-family:'Barlow',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.title-font{
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:0.5px;
  font-weight:400;
}
.hidden{display:none !important;}
a{color:inherit;}
button{font-family:'Barlow',sans-serif;cursor:pointer;}
input,select,button{font-family:inherit;font-size:16px;}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:4px;}

/* ---------- LOADING SCREEN ---------- */
#loading-screen{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--navy);z-index:999;gap:18px;padding:20px;text-align:center;
}
.spinner{
  width:52px;height:52px;border-radius:50%;
  border:4px solid rgba(255,215,0,0.15);
  border-top-color:var(--gold);
  animation:spin 0.9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
#slow-btn{
  margin-top:10px;background:transparent;border:1px solid var(--card-border);color:var(--muted);
  padding:10px 18px;border-radius:999px;font-size:13px;transition:all .2s;
}
#slow-btn:active{transform:scale(0.96);}

/* ---------- APP SHELL ---------- */
#app{max-width:var(--maxw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

header.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(11,29,58,0.9);backdrop-filter:blur(10px);
  border-bottom:2px solid transparent;
  border-image:linear-gradient(90deg, var(--red), var(--gold-dim), transparent) 1;
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .helmet-icon{width:40px;height:29px;flex-shrink:0;}
.brand .nfl-logo{width:34px;height:34px;flex-shrink:0;object-fit:contain;}
.brand-text{display:flex;flex-direction:column;line-height:1;}
.brand-text .brand-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);letter-spacing:1.5px;line-height:1;}
.brand-text .brand-sub{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:1px;}
.user-chip{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;}
.user-chip .avatar{width:32px;height:32px;border-radius:50%;background:var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:16px;border:1.5px solid var(--gold);}
.user-chip .rank-badge{background:var(--gold);color:var(--navy);font-weight:700;font-size:11px;padding:2px 8px;border-radius:999px;}

main#view{flex:1;padding:16px 14px 90px 14px;}

nav.bottomnav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);
  background:rgba(9,22,45,0.96);backdrop-filter:blur(10px);
  border-top:1px solid var(--card-border);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)) 4px;z-index:50;
}
nav.bottomnav button{
  background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.5px;padding:4px 8px;border-radius:10px;transition:all .15s;
  flex:1;text-transform:uppercase;
}
nav.bottomnav button.active{color:var(--gold);}
nav.bottomnav button .nav-icon{font-size:19px;line-height:1;}
nav.bottomnav button:active{transform:scale(0.94);}

/* ---------- GENERIC ---------- */
.card{
  background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:16px;margin-bottom:14px;
}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--gold);letter-spacing:1px;margin:4px 0 12px 0;border-left:3px solid var(--red);padding-left:10px;}
.muted{color:var(--muted);font-size:13px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:12px;padding:13px 18px;font-weight:700;font-size:15px;
  transition:transform .12s, filter .12s;width:100%;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:linear-gradient(135deg,var(--gold),#e6c200);color:var(--navy);}
.btn-outline{background:transparent;border:1.5px solid var(--card-border);color:var(--text);}
.btn-red{background:var(--red);color:#fff;}
.btn-small{padding:9px 14px;font-size:13px;width:auto;border-radius:10px;}
.btn:disabled{opacity:0.5;pointer-events:none;}
input[type=text],input[type=email],input[type=password],input[type=number],select{
  width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--card-border);
  background:rgba(255,255,255,0.04);color:var(--text);margin-bottom:12px;outline:none;
}
input:focus,select:focus{border-color:var(--gold);}
input::placeholder{color:var(--muted);}
label{font-family:'Barlow Condensed',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);display:block;margin-bottom:6px;}
.field{margin-bottom:14px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.center{text-align:center;}
.toast-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:1000;width:calc(100% - 32px);max-width:calc(var(--maxw) - 32px);display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:#1a2f57;border:1px solid var(--gold);color:var(--text);padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,0.4);animation:toastin .25s ease;}
.toast.err{border-color:var(--red);}
@keyframes toastin{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- AUTH ---------- */
.auth-wrap{padding-top:8vh;}
.auth-logo{display:flex;flex-direction:column;align-items:center;margin-bottom:28px;}
.auth-logo .helmet-icon{width:126px;height:92px;margin-bottom:10px;filter:drop-shadow(0 8px 22px rgba(230,57,70,0.35));}
.auth-logo .nfl-logo{width:112px;height:112px;margin-bottom:10px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(230,57,70,0.35));}
.auth-logo .auth-title{font-size:52px;color:var(--gold);letter-spacing:3px;line-height:1;}
.auth-logo .auth-sub{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--muted);letter-spacing:4px;text-transform:uppercase;margin-top:2px;}
.tabbar{display:flex;background:rgba(255,255,255,0.05);border-radius:12px;padding:4px;margin-bottom:20px;}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:10px;border-radius:9px;font-weight:600;font-size:14px;}
.tabbar button.active{background:var(--gold);color:var(--navy);}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;max-height:260px;overflow-y:auto;}
.avatar-opt{aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,0.04);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:22px;}
.avatar-opt.selected{border-color:var(--gold);background:rgba(255,215,0,0.12);}
.team-avatar-opt{padding:6px;}
.team-avatar-opt img{width:100%;height:100%;object-fit:contain;}
.avatar-preview-row{display:flex;justify-content:center;margin-bottom:14px;}
.avatar-preview{width:88px;height:88px;border-radius:50%;background:var(--navy-3);border:2px solid var(--gold);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;}
.avatar-preview img{width:100%;height:100%;object-fit:cover;display:block;}
input[type=file]{width:100%;padding:12px;border-radius:12px;border:1.5px dashed var(--card-border);background:rgba(255,255,255,0.04);color:var(--muted);margin-bottom:6px;font-size:13px;}
.avatar img,.member-pill .avatar img,.podium-avatar img,.stand-avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;}

/* ---------- GROUPS ---------- */
.group-card{border-left:4px solid var(--gold);}
.invite-code{
  font-family:'Barlow Condensed',sans-serif;letter-spacing:3px;font-size:20px;font-weight:700;
  background:rgba(255,215,0,0.1);color:var(--gold);padding:8px 14px;border-radius:10px;display:inline-block;
  border:1px dashed var(--gold-dim);
}
.member-pill{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.member-pill:last-child{border-bottom:none;}
.member-pill .avatar{width:28px;height:28px;border-radius:50%;background:var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:14px;}
.group-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.group-item:last-child{border-bottom:none;}
.group-item.current{color:var(--gold);}

/* ---------- MATCHES ---------- */
.week-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;scrollbar-width:none;}
.week-tabs::-webkit-scrollbar{display:none;}
.week-chip{
  flex-shrink:0;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);color:var(--muted);
  padding:8px 14px;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:0.5px;white-space:nowrap;
}
.week-chip.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.match-card{position:relative;overflow:hidden;}
.match-date{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.lock-badge{background:rgba(230,57,70,0.15);color:var(--red);padding:2px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:1px;}
.teams-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
.team-block{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
.team-block .helmet-icon{width:40px;height:29px;}
.team-block .team-logo{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.4));}
.team-block .team-abbr{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;}
.team-block .team-name{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}
.vs-block{font-family:'Bebas Neue',sans-serif;color:var(--red);font-size:15px;padding:0 4px;font-weight:700;}
.score-final{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--gold);}
.vote-zone{margin-top:4px;padding-top:12px;border-top:1px dashed var(--card-border);}
.vote-zone-title{font-family:'Barlow Condensed',sans-serif;font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:9px;}
.vote-stat{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-family:'Barlow Condensed',sans-serif;font-size:12px;}
.vote-stat:last-child{margin-bottom:0;}
.vote-stat-label{width:46px;flex-shrink:0;font-weight:700;letter-spacing:0.5px;}
.vote-stat-bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,0.07);overflow:hidden;}
.vote-stat-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:999px;}
.vote-stat-fill.red{background:linear-gradient(90deg,#8f1c24,var(--red));}
.vote-stat-pct{width:36px;text-align:right;flex-shrink:0;color:var(--muted);}
.vote-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-family:'Barlow Condensed',sans-serif;}
.vote-row:last-child{border-bottom:none;}
.vote-row-name{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px;}
.vote-row-avatar{width:20px;height:20px;border-radius:50%;background:var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;overflow:hidden;}
.vote-row-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vote-row-pick{flex-shrink:0;color:var(--gold);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;font-size:12px;text-align:right;}
.pick-row{display:flex;gap:8px;margin-bottom:10px;}
.pick-btn{
  flex:1;background:rgba(255,255,255,0.04);border:1.5px solid var(--card-border);color:var(--text);
  padding:10px 6px;border-radius:10px;font-size:13px;font-weight:600;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.5px;
  text-transform:uppercase;position:relative;
}
.pick-btn.selected{background:rgba(255,215,0,0.15);border-color:var(--gold);color:var(--gold);}
.pick-btn .pct{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-weight:400;}
.pick-btn.selected .pct{color:var(--gold-dim);}
.ou-line{text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:1px;}
.points-tag{position:absolute;top:10px;right:10px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;letter-spacing:0.5px;}
.pts-gold{background:linear-gradient(135deg,var(--gold),#e6c200);color:var(--navy);}
.pts-normal{background:rgba(255,255,255,0.12);color:var(--text);}
.pts-zero{background:rgba(230,57,70,0.15);color:var(--red);}

/* ---------- STANDINGS ---------- */
.podium{display:flex;align-items:flex-end;gap:8px;margin-bottom:20px;}
.podium-item{flex:1;text-align:center;background:var(--card);border:1px solid var(--card-border);border-radius:14px 14px 0 0;padding:14px 8px;}
.podium-item.p1{padding-top:24px;border-top:2px solid var(--gold);}
.podium-item.p2{border-top:2px solid #c0c0c0;}
.podium-item.p3{border-top:2px solid #cd7f32;}
.podium-medal{font-size:26px;}
.podium-avatar{width:44px;height:44px;border-radius:50%;background:var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:22px;margin:6px auto;}
.podium-name{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.podium-pts{font-family:'Bebas Neue',sans-serif;color:var(--gold);font-size:20px;}
.stand-row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid rgba(255,255,255,0.06);border-radius:8px;}
.stand-row.me{background:rgba(255,215,0,0.08);border:1px solid var(--gold-dim);}
.stand-rank{width:22px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:17px;color:var(--muted);}
.stand-avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.stand-info{flex:1;min-width:0;}
.stand-name-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.stand-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.stand-pick{flex-shrink:0;color:var(--gold);font-weight:700;font-size:11px;letter-spacing:0.5px;text-transform:uppercase;}
.stand-sub{font-size:11px;color:var(--muted);}
.stand-pts{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--gold);}
.diff-box{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;justify-content:space-between;}

/* ---------- ADMIN ---------- */
.admin-match{border:1px solid var(--card-border);}
.admin-teams{font-family:'Barlow Condensed',sans-serif;font-size:14px;margin-bottom:8px;color:var(--muted);}
.score-inputs{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.score-inputs input{margin-bottom:0;text-align:center;width:64px;flex:none;}
.score-inputs span{color:var(--muted);}
.admin-reveal-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.admin-reveal-status{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);letter-spacing:0.3px;}
.admin-reveal-btns{display:flex;gap:6px;}
.btn-tiny{background:rgba(255,255,255,0.04);border:1.5px solid var(--card-border);color:var(--muted);padding:5px 10px;border-radius:8px;font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3px;text-transform:uppercase;}
.btn-tiny.active{background:rgba(255,215,0,0.15);border-color:var(--gold);color:var(--gold);}

footer.build-note{text-align:center;color:var(--muted);font-size:11px;padding:14px;opacity:0.6;}

document.addEventListener('DOMContentLoaded', boot);

let slowBtnTimer = setTimeout(()=>{
  if(state.view === 'loading'){
    const btn = document.getElementById('slow-btn');

  }
}, 4000);

async function boot(){
  const bootTimeout = setTimeout(()=>{
    console.warn('Timeout de carga alcanzado, limpiando sesión.');
    localStorage.clear();
    state.view = 'auth';
    render();
  }, 8000);

  try{
    const { data, error } = await sb.auth.getSession();
    clearTimeout(bootTimeout);
    if(error) throw error;
    if(data && data.session){
      await onLogin(data.session);
    } else {
      state.view = 'auth';
      render();
    }
  }catch(e){
    clearTimeout(bootTimeout);
    console.error('Error al iniciar sesión guardada', e);
    localStorage.clear();
    state.view = 'auth';
    render();
  }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_OUT'){
      resetState();
      state.view = 'auth';
      render();
    }
  });
}

function resetState(){

  state.profile = null;

}

async function ensureProfile(){
  let { data } = await sb.from('profiles').select('*').eq('id', state.session.user.id).maybeSingle();
  if(!data){
    const meta = state.session.user.user_metadata || {};
    const { data: created } = await sb.from('profiles').insert({
      id: state.session.user.id,
      name: meta.name || (state.session.user.email||'').split('@')[0],
      avatar: meta.avatar || '🏈',
      is_admin: isAdmin(),
    }).select().maybeSingle();
    data = created;
  }
  state.profile = data;
}

async function loadMatches(){
  const { data, error } = await sb.from('matches').select('*')
    .order('match_date', { ascending:true })
    .order('match_time', { ascending:true })
    .limit(10000);
  if(error){ console.error(error); toast('Error al cargar partidos: '+error.message, true); return; }
  state.matches = data || [];
}

// para la tabla de posiciones y la "zona de votos" necesitamos los perfiles y predicciones
// de TODOS los jugadores, no solo los del usuario actual.
async function loadAllProfiles(){
  const { data, error } = await sb.from('profiles').select('*').limit(10000);
  if(error){ console.error(error); state.allProfiles = []; return; }
  state.allProfiles = data || [];
}

async function loadAllPredictions(){
  const { data, error } = await sb.from('predictions').select('*').limit(10000);
  if(error){ console.error(error); state.allPredictions = []; return; }
  state.allPredictions = data || [];
}

async function onLogin(session){
  state.session = session;
  try{
    await ensureProfile();
    await Promise.all([loadMatches(), loadAllProfiles(), loadAllPredictions()]);
    state.myPredictions = {};
    state.allPredictions.filter(p => p.user_id === session.user.id).forEach(p => state.myPredictions[p.match_id] = p);
    state.view = 'matches';
  }catch(e){
    console.error(e);
    toast('Hubo un problema al cargar tu cuenta. Intenta de nuevo.', true);
    state.view = 'matches';
  }
  render();
}

/* ---------------- PREDICTIONS ---------------- */
function matchDateTime(m){
  return new Date(m.match_date + 'T' + m.match_time + '-06:00');
}
function isLocked(m){
  return new Date() >= matchDateTime(m);
}
function isFinished(m){
  return m.home_score !== null && m.home_score !== undefined && m.away_score !== null && m.away_score !== undefined;
}
const REVEAL_WINDOW_MS = 2 * 24 * 60 * 60 * 1000; // los partidos se destapan 2 días antes de su hora de inicio
function isRevealed(m){
  // El admin puede forzar un partido a estar destapado (true) u oculto (false) con el botón
  // de Admin, sin importar la fecha. Si no forzó nada (reveal_override es null/undefined),
  // se usa la regla automática de siempre: 2 días antes de que arranque.
  if(m.reveal_override === true) return true;
  if(m.reveal_override === false) return false;
  if(isLocked(m)) return true; // ya arrancó o ya se jugó: siempre visible
  return (matchDateTime(m).getTime() - Date.now()) <= REVEAL_WINDOW_MS;
}

async function predict(matchId, field, value){
  if(!state.session){ toast('Debes iniciar sesión para predecir', true); return; }
  const match = state.matches.find(m=>m.id===matchId);
  if(!match) return;
  if(isLocked(match)){ toast('Este partido ya comenzó, no puedes cambiar tu predicción', true); return; }

  const existing = state.myPredictions[matchId] || {};
  const payload = {
    user_id: state.session.user.id,
    match_id: matchId,
    winner: field === 'winner' ? value : (existing.winner ?? null),
    over_under: field === 'over_under' ? value : (existing.over_under ?? null),
  };
  const { data, error } = await sb.from('predictions')
    .upsert(payload, { onConflict: 'user_id,match_id' })
    .select();
  if(error){ toast('Error al guardar tu predicción: ' + error.message, true); return; }
  const saved = (data && data[0]) || payload;
  state.myPredictions[matchId] = saved;
  // mantenemos allPredictions al día para que la "zona de votos" refleje el voto recién guardado sin recargar
  const idx = state.allPredictions.findIndex(p => p.user_id === saved.user_id && p.match_id === saved.match_id);
  if(idx >= 0) state.allPredictions[idx] = saved; else state.allPredictions.push(saved);
  renderView();
}

/* ---------------- POINTS ---------------- */
function phasePoints(phase){
  if(phase === 'Conference Championship' || phase === 'Super Bowl') return { both:5, one:1 };
  if(phase === 'Wild Card' || phase === 'Divisional') return { both:4, one:1 };
  return { both:3, one:1 };
}
function matchWinner(m){
  if(!isFinished(m) || m.home_score === m.away_score) return null;
  return m.home_score > m.away_score ? 'home' : 'away';
}
function matchOU(m){
  if(!isFinished(m)) return null;
  const total = m.home_score + m.away_score;
  const line = Number(m.ou_line); // ou_line viene como decimal/numeric y Supabase puede serializarlo como string
  if(total === line) return null;
  return total > line ? 'over' : 'under';
}
function matchPoints(match, pred){
  if(!isFinished(match)) return null;
  if(!pred) return 0;
  let correct = 0;
  const w = matchWinner(match);
  if(w && pred.winner === w) correct++;
  const ou = matchOU(match);
  if(ou && pred.over_under === ou) correct++;
  const cfg = phasePoints(match.phase);
  if(correct === 2) return cfg.both;
  if(correct === 1) return cfg.one;
  return 0;
}
function ptsClass(p){
  if(p === null || p === undefined) return '';
  if(p >= 3) return 'pts-gold';
  if(p > 0) return 'pts-normal';
  return 'pts-zero';
}

function computeStandings(){
  // Ya no hay grupos: la tabla de posiciones incluye a todos los jugadores registrados.
  const finished = state.matches.filter(isFinished);
  const byUser = {};
  state.allProfiles.forEach(p=>{
    byUser[p.id] = { user_id: p.id, profile: p, points:0, correct:0, played:0 };
  });
  finished.forEach(match=>{
    state.allPredictions.filter(p=>p.match_id === match.id).forEach(pred=>{
      const row = byUser[pred.user_id];
      if(!row) return;
      const pts = matchPoints(match, pred);
      if(pts === null) return;
      row.points += pts;
      row.played += 1;
      if(pts > 0) row.correct += 1;
    });
  });
  return Object.values(byUser).sort((a,b)=> b.points - a.points || b.correct - a.correct);
}

/* ---------------- HELPERS ---------------- */
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function setBusy(b){ state.busy = b; document.querySelectorAll('[data-busy-target]').forEach(el=> el.disabled = b); }
function toast(msg, isErr){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3600);
}
function fmtDate(m){
  // IMPORTANTE: match_date/match_time ya están guardados en hora de Guadalajara (CST -06:00).
  // Los mostramos tal cual, sin pasar por el reloj/huso horario local del navegador del usuario,
  // para que SIEMPRE se vean en hora de Guadalajara sin importar dónde esté quien los mire.
  const dias = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const [y, mo, day] = m.match_date.split('-').map(Number);
  const [hh, mm] = m.match_time.split(':').map(Number);
  const dow = new Date(Date.UTC(y, mo - 1, day)).getUTCDay();
  let h = hh; const min = String(mm).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return `${dias[dow]} ${day} ${meses[mo - 1]} · ${h}:${min} ${ampm} (GDL)`;
}
function teamInfo(name){
  return TEAMS[name] || { abbr: (name||'???').slice(0,3).toUpperCase(), color:'#FFD700' };
}
/* El avatar de un perfil puede ser: un emoji (formato viejo), una foto subida (data: URL)
   o el logo de un equipo (URL http). Esta función decide cómo pintarlo. */
function avatarHtml(a){
  a = a || '🏈';
  if(typeof a === 'string' && (a.indexOf('data:') === 0 || a.indexOf('http') === 0)){
    return `<img src="${a}" alt="avatar" loading="lazy" onerror="this.replaceWith(document.createTextNode('🏈'))">`;
  }
  return esc(a);
}

   RENDER
   ========================================================= */
function render(){
  const loadingScreen = document.getElementById('loading-screen');
  const app = document.getElementById('app');
  if(state.view === 'loading'){
    loadingScreen.classList.remove('hidden');
    app.classList.add('hidden');
    return;
  }
  loadingScreen.classList.add('hidden');
  app.classList.remove('hidden');
  renderHeader();
  renderNav();
  renderView();
}

function renderHeader(){
  const header = document.getElementById('header-bar');
  if(!state.session){
    header.innerHTML = `<div class="brand">${nflLogoImg()}<div class="brand-text"><span class="brand-title">NFL 26</span><span class="brand-sub">by JASoltero</span></div></div>`;
    return;
  }
  let rankHtml = '';
  if(state.allProfiles.length){
    const standings = computeStandings();
    const idx = standings.findIndex(r=>r.user_id === state.session.user.id);
    if(idx >= 0) rankHtml = `<span class="rank-badge">#${idx+1} · ${standings[idx].points} PTS</span>`;
  }
  header.innerHTML = `
    <div class="brand">${nflLogoImg()}<div class="brand-text"><span class="brand-title">NFL 26</span><span class="brand-sub">by JASoltero</span></div></div>
    <div class="user-chip">
      ${rankHtml}
      <div class="avatar">${avatarHtml(state.profile&&state.profile.avatar)}</div>
    </div>`;
}

function renderNav(){
  const nav = document.getElementById('bottomnav');
  if(!state.session){ nav.classList.add('hidden'); nav.innerHTML=''; return; }
  nav.classList.remove('hidden');
  const items = [
    {v:'matches', icon:'🏈', label:'Partidos'},
    {v:'standings', icon:'📊', label:'Tabla'},
  ];
  if(isAdmin()) items.push({v:'admin', icon:'⚙️', label:'Admin'});
  items.push({v:'profile', icon:'🙍', label:'Perfil'});
  nav.innerHTML = items.map(it => `
    <button class="${state.view===it.v?'active':''}" onclick="state.view='${it.v}'; renderHeader(); renderNav(); renderView();">
      <span class="nav-icon">${it.icon}</span>${it.label}
    </button>`).join('') + `
    <button onclick="doLogout()"><span class="nav-icon">🚪</span>Salir</button>`;
}

function renderView(){
  const view = document.getElementById('view');
  let html = '';
  switch(state.view){
    case 'auth': html = viewAuth(); break;
    case 'matches': html = viewMatches(); break;
    case 'standings': html = viewStandings(); break;
    case 'admin': html = isAdmin() ? viewAdmin() : viewMatches(); break;
    case 'profile': html = viewProfile(); break;
    default: html = viewMatches();
  }
  view.innerHTML = html;
}

/* ---------------- SELECTOR DE AVATAR (foto o logo de equipo) ----------------
   Se actualiza solo dentro de #avatar-picker-wrap, para no perder lo que el
   usuario ya escribió en nombre/correo/contraseña en el resto del formulario. */
function avatarPickerBodyHtml(){
  if(state.avatarPickerTab === 'equipo'){
    return `<div class="avatar-grid">` + Object.keys(TEAMS).map(name=>{
      const url = teamLogoUrl(name);
      const sel = state.regAvatar === url;
      return `<div class="avatar-opt team-avatar-opt ${sel?'selected':''}" title="${esc(name)}" onclick="selectTeamAvatar('${url}')"><img src="${url}" alt="${esc(TEAMS[name].abbr)}" loading="lazy"></div>`;
    }).join('') + `</div>`;
  }
  return `
    <input type="file" accept="image/*" id="avatar-file-input" onchange="handleAvatarFile(event)">
    <div class="muted" style="font-size:12px;">Se ajusta y comprime automáticamente a un tamaño chico.</div>
  `;
}
function avatarPickerWrapHtml(){
  return `
    <div class="avatar-preview-row"><div class="avatar-preview">${avatarHtml(state.regAvatar)}</div></div>
    <div class="tabbar" style="margin-bottom:10px;">
      <button type="button" class="${state.avatarPickerTab==='foto'?'active':''}" onclick="state.avatarPickerTab='foto'; renderAvatarPickerWrap();">Subir foto</button>
      <button type="button" class="${state.avatarPickerTab==='equipo'?'active':''}" onclick="state.avatarPickerTab='equipo'; renderAvatarPickerWrap();">Logo de equipo</button>
    </div>
    <div id="avatar-picker-body">${avatarPickerBodyHtml()}</div>
  `;
}
function renderAvatarPickerWrap(){
  const el = document.getElementById('avatar-picker-wrap');
  if(!el) return;
  el.innerHTML = avatarPickerWrapHtml();
}
function selectTeamAvatar(url){
  state.regAvatar = url;
  renderAvatarPickerWrap();
}
function handleAvatarFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  if(!file.type || file.type.indexOf('image/') !== 0){ toast('Selecciona un archivo de imagen', true); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const size = 200;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      state.regAvatar = canvas.toDataURL('image/jpeg', 0.82);
      renderAvatarPickerWrap();
    };
    img.onerror = function(){ toast('No se pudo leer esa imagen, intenta con otra', true); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- VIEW: MATCHES ----------------
   Ya no hay pestañas de semana/fase para navegar a mano: se detecta sola la "semana actual"
   (el próximo partido sin jugar que ya se destapó, o si toda la semana ya se jugó, la más
   reciente) y esa es la que se muestra. El rótulo de semana/fase queda chiquito, arriba de
   cada partido (ver renderMatchCard), no como botones para picarle. */
function currentMatchesBucket(){
  const revealed = state.matches.filter(isRevealed);
  if(!revealed.length) return null;
  const upcoming = revealed.filter(m=>!isFinished(m)).sort((a,b)=>matchDateTime(a)-matchDateTime(b));
  if(upcoming.length) return { phase: upcoming[0].phase, week: upcoming[0].week };
  const past = revealed.slice().sort((a,b)=>matchDateTime(b)-matchDateTime(a));
  return { phase: past[0].phase, week: past[0].week };
}

// El partido "en curso" (uno solo): el próximo por jugarse ya destapado, o si no hay ninguno
// pendiente, el más reciente que ya se jugó. Se usa en la Tabla para mostrar, junto al nombre
// de cada quien, lo que predijo para ESE partido en específico.
function currentFeaturedMatch(){
  const revealed = state.matches.filter(isRevealed);
  if(!revealed.length) return null;
  const upcoming = revealed.filter(m=>!isFinished(m)).sort((a,b)=>matchDateTime(a)-matchDateTime(b));
  if(upcoming.length) return upcoming[0];
  const past = revealed.slice().sort((a,b)=>matchDateTime(b)-matchDateTime(a));
  return past[0] || null;
}

function viewMatches(){
  const bucket = currentMatchesBucket();
  if(!bucket){
    return `<div class="section-title" style="margin-top:0;">Partidos</div>
    <div class="card center muted">Aún no hay partidos disponibles — cada partido se destapa 2 días antes de su hora de inicio. Vuelve más cerca de la fecha.</div>`;
  }

  let list = state.matches.filter(m => m.phase === bucket.phase && m.week === bucket.week && isRevealed(m));
  list = list.slice().sort((a,b)=> matchDateTime(a) - matchDateTime(b));

  const cards = list.map(m => renderMatchCard(m)).join('') || '<div class="card center muted">Aún no hay partidos disponibles aquí — cada partido se destapa 2 días antes de su hora de inicio. Vuelve más cerca de la fecha.</div>';

  return `
    <div class="section-title" style="margin-top:0;">Partidos</div>
    ${cards}
  `;
}

function renderMatchCard(m){
  const home = teamInfo(m.home), away = teamInfo(m.away);
  const locked = isLocked(m);
  const finished = isFinished(m);
  const pred = state.myPredictions[m.id];
  const pts = finished ? matchPoints(m, pred) : null;

  // "Cómo votaron todos" en Partidos: porcentajes de quién le fue a cada equipo y a Over/Under.
  // (El detalle de "quién puso qué" por nombre vive en la Tabla, no aquí.)
  // Solo se muestra una vez que el partido ya cerró (bloqueado), para no revelar picks antes.
  let voteStats = null;
  if(locked && state.allPredictions.length){
    const forMatch = state.allPredictions.filter(p=>p.match_id===m.id);
    const total = forMatch.length || 1;
    const homeVotes = forMatch.filter(p=>p.winner==='home').length;
    const awayVotes = forMatch.filter(p=>p.winner==='away').length;
    const overVotes = forMatch.filter(p=>p.over_under==='over').length;
    const underVotes = forMatch.filter(p=>p.over_under==='under').length;
    voteStats = {
      home: Math.round(100*homeVotes/total), away: Math.round(100*awayVotes/total),
      over: Math.round(100*overVotes/total), under: Math.round(100*underVotes/total),
    };
  }

  const winnerBtn = (side, team) => {
    const selected = pred && pred.winner === side;
    return `<button class="pick-btn ${selected?'selected':''}" ${locked?'disabled':''} onclick="predict(${m.id},'winner','${side}')">
      ${teamInfo(team).abbr}
    </button>`;
  };
  const ouBtn = (side, label) => {
    const selected = pred && pred.over_under === side;
    return `<button class="pick-btn ${selected?'selected':''}" ${locked?'disabled':''} onclick="predict(${m.id},'over_under','${side}')">
      ${label}
    </button>`;
  };

  const voteZoneHtml = voteStats ? `
    <div class="vote-zone">
      <div class="vote-zone-title">Cómo votaron todos</div>
      <div class="vote-stat">
        <span class="vote-stat-label">${away.abbr}</span>
        <div class="vote-stat-bar"><div class="vote-stat-fill" style="width:${voteStats.away}%"></div></div>
        <span class="vote-stat-pct">${voteStats.away}%</span>
      </div>
      <div class="vote-stat">
        <span class="vote-stat-label">${home.abbr}</span>
        <div class="vote-stat-bar"><div class="vote-stat-fill" style="width:${voteStats.home}%"></div></div>
        <span class="vote-stat-pct">${voteStats.home}%</span>
      </div>
      <div class="vote-stat">
        <span class="vote-stat-label">OVER</span>
        <div class="vote-stat-bar"><div class="vote-stat-fill red" style="width:${voteStats.over}%"></div></div>
        <span class="vote-stat-pct">${voteStats.over}%</span>
      </div>
      <div class="vote-stat">
        <span class="vote-stat-label">UNDER</span>
        <div class="vote-stat-bar"><div class="vote-stat-fill red" style="width:${voteStats.under}%"></div></div>
        <span class="vote-stat-pct">${voteStats.under}%</span>
      </div>
    </div>` : '';

  return `
  <div class="card match-card">
    ${pts !== null ? `<div class="points-tag ${ptsClass(pts)}">+${pts} PTS</div>` : ''}
    <div class="match-date">
      <span>${m.phase !== 'Temporada Regular' ? m.phase : 'Semana ' + m.week} · ${fmtDate(m)}</span>
      ${locked && !finished ? '<span class="lock-badge">CERRADO</span>' : ''}
    </div>
    <div class="teams-row">
      <div class="team-block">${teamLogoImg(m.away)}<div class="team-abbr">${away.abbr}</div><div class="team-name">${esc(m.away)}</div></div>
      ${finished ? `<div class="score-final">${m.away_score} - ${m.home_score}</div>` : `<div class="vs-block">@</div>`}
      <div class="team-block">${teamLogoImg(m.home)}<div class="team-abbr">${home.abbr}</div><div class="team-name">${esc(m.home)}</div></div>
    </div>
    <div class="pick-row">${winnerBtn('away', m.away)}${winnerBtn('home', m.home)}</div>
    <div class="ou-line">TOTAL DE PUNTOS · LÍNEA ${m.ou_line}</div>
    <div class="pick-row">${ouBtn('under','UNDER')}${ouBtn('over','OVER')}</div>
    ${voteZoneHtml}
  </div>`;
}

/* ---------------- VIEW: STANDINGS ---------------- */
function viewStandings(){
  const standings = computeStandings();
  const myIdx = standings.findIndex(r=>r.user_id === state.session.user.id);

  // Junto al nombre de cada quien, pegado a la derecha, mostramos lo que predijo para el
  // partido "en curso" (el mismo que aparece en Partidos). Solo se revela una vez que ese
  // partido ya cerró, para no destapar picks de nadie antes de tiempo.
  const featured = currentFeaturedMatch();
  const featuredLocked = featured ? isLocked(featured) : false;
  function pickTextFor(userId){
    if(!featured || !featuredLocked) return '';
    const p = state.allPredictions.find(pr=>pr.match_id===featured.id && pr.user_id===userId);
    if(!p || (!p.winner && !p.over_under)) return '';
    const parts = [];
    if(p.winner) parts.push(teamInfo(p.winner==='home'?featured.home:featured.away).abbr);
    if(p.over_under) parts.push(p.over_under==='over'?'Over':'Under');
    return parts.join(' · ');
  }
  let featuredNoteHtml = '';
  if(featured){
    const label = teamInfo(featured.away).abbr + ' @ ' + teamInfo(featured.home).abbr;
    featuredNoteHtml = `<div class="muted" style="margin-bottom:12px;">${featuredLocked
      ? 'A la derecha de cada nombre: su predicción para ' + esc(label)
      : 'Las predicciones para ' + esc(label) + ' se mostrarán aquí en cuanto arranque ese partido.'}</div>`;
  }

  let podiumHtml = '';
  const top3 = standings.slice(0,3);
  if(top3.length){
    const medals = ['🥇','🥈','🥉'];
    const order = top3.length===3 ? [1,0,2] : top3.map((_,i)=>i);
    podiumHtml = `<div class="podium">` + order.filter(i=>top3[i]).map(i => `
      <div class="podium-item p${i+1}">
        <div class="podium-medal">${medals[i]}</div>
        <div class="podium-avatar">${avatarHtml(top3[i].profile.avatar)}</div>
        <div class="podium-name">${esc(top3[i].profile.name||'Jugador')}</div>
        <div class="podium-pts">${top3[i].points}</div>
      </div>`).join('') + `</div>`;
  }

  let diffHtml = '';
  if(myIdx >= 0){
    const above = myIdx > 0 ? standings[myIdx-1] : null;
    const below = myIdx < standings.length-1 ? standings[myIdx+1] : null;
    diffHtml = `<div class="diff-box">
      <span>${above ? '↑ +' + (above.points - standings[myIdx].points) + ' PTS para alcanzar a ' + esc(above.profile.name||'') : 'Vas en primer lugar 🏆'}</span>
      <span>${below ? '↓ +' + (standings[myIdx].points - below.points) + ' PTS de ventaja sobre ' + esc(below.profile.name||'') : ''}</span>
    </div>`;
  }

  const rows = standings.map((r,i) => {
    const pickText = pickTextFor(r.user_id);
    return `
    <div class="stand-row ${r.user_id===state.session.user.id?'me':''}">
      <div class="stand-rank">${i+1}</div>
      <div class="stand-avatar">${avatarHtml(r.profile.avatar)}</div>
      <div class="stand-info">
        <div class="stand-name-row">
          <div class="stand-name">${esc(r.profile.name||'Jugador')}</div>
          ${pickText ? `<div class="stand-pick">${esc(pickText)}</div>` : ''}
        </div>
        <div class="stand-sub">${r.correct} aciertos · ${r.played} jugados</div>
      </div>
      <div class="stand-pts">${r.points}</div>
    </div>`;
  }).join('') || '<div class="muted center">Aún no hay resultados capturados.</div>';

  return `
    <div class="section-title" style="margin-top:0;">Tabla de posiciones</div>
    ${podiumHtml}
    ${diffHtml}
    ${featuredNoteHtml}
    <div class="card">${rows}</div>
  `;
}

/* ---------------- VIEW: ADMIN ---------------- */
function viewAdmin(){
  const phases = PHASES_ORDER.filter(p => state.matches.some(m=>m.phase===p));
  const grouped = {};
  state.matches.forEach(m=>{
    const key = m.phase === 'Temporada Regular' ? `Semana ${m.week}` : m.phase;
    grouped[key] = grouped[key] || [];
    grouped[key].push(m);
  });

  // Botón chiquito de Destapar/Tapar/Automático por partido: le da al admin control manual
  // sobre cuándo se ve cada partido en Partidos, sin importar la regla automática de 2 días.
  function revealStatusLabel(m){
    if(m.reveal_override === true) return '👁️ Destapado (forzado por ti)';
    if(m.reveal_override === false) return '🚫 Tapado (forzado por ti)';
    return isRevealed(m) ? '🕒 Automático · visible ahora' : '🕒 Automático · se destapa 2 días antes';
  }
  function revealControlsHtml(m){
    return `
      <div class="admin-reveal-row">
        <span class="admin-reveal-status">${revealStatusLabel(m)}</span>
        <div class="admin-reveal-btns">
          <button class="btn-tiny ${m.reveal_override===true?'active':''}" data-busy-target onclick="adminSetReveal(${m.id}, true)">Destapar</button>
          <button class="btn-tiny ${m.reveal_override==null?'active':''}" data-busy-target onclick="adminSetReveal(${m.id}, null)">Automático</button>
          <button class="btn-tiny ${m.reveal_override===false?'active':''}" data-busy-target onclick="adminSetReveal(${m.id}, false)">Tapar</button>
        </div>
      </div>`;
  }

  const matchAdminHtml = Object.keys(grouped).map(key => `
    <div class="section-title">${key}</div>
    ${grouped[key].map(m => `
      <div class="card admin-match">
        <div class="admin-teams">${esc(m.away)} @ ${esc(m.home)} — ${fmtDate(m)}</div>
        ${revealControlsHtml(m)}
        <div class="row" style="margin-bottom:8px;">
          <input type="text" id="admin-awayteam-${m.id}" value="${esc(m.away)}" placeholder="Equipo visitante">
          <input type="text" id="admin-hometeam-${m.id}" value="${esc(m.home)}" placeholder="Equipo local">
        </div>
        <button class="btn btn-outline btn-small" style="margin-bottom:14px;" data-busy-target onclick="adminSaveTeams(${m.id})">Guardar nombres</button>
        <div class="score-inputs">
          <input type="number" id="admin-away-${m.id}" value="${m.away_score ?? ''}" placeholder="0">
          <span>–</span>
          <input type="number" id="admin-home-${m.id}" value="${m.home_score ?? ''}" placeholder="0">
          <span style="margin-left:10px;">O/U</span>
          <input type="number" step="0.5" id="admin-ou-${m.id}" value="${m.ou_line}" style="width:76px;">
        </div>
        <div class="row">
          <button class="btn btn-primary btn-small" data-busy-target onclick="adminSaveScore(${m.id})">Guardar marcador</button>
          <button class="btn btn-red btn-small" data-busy-target onclick="adminClearScore(${m.id})">Borrar resultado</button>
        </div>
      </div>
    `).join('')}
  `).join('');

  return `
    <div class="section-title" style="margin-top:0;">Panel Admin</div>
    <div class="card">
      <div class="section-title" style="font-size:18px;margin-top:0;">Agregar partido de Playoffs</div>
      <div class="field"><label>Fase</label>
        <select id="admin-new-phase">
          <option>Wild Card</option><option>Divisional</option><option>Conference Championship</option><option>Super Bowl</option>
        </select>
      </div>
      <div class="row">
        <div class="field"><label>Visitante</label><input type="text" id="admin-new-away" placeholder="Por definir"></div>
        <div class="field"><label>Local</label><input type="text" id="admin-new-home" placeholder="Por definir"></div>
      </div>
      <div class="row">
        <div class="field"><label>Fecha</label><input type="date" id="admin-new-date"></div>
        <div class="field"><label>Hora (GDL 24h)</label><input type="time" id="admin-new-time"></div>
      </div>
      <button class="btn btn-primary" data-busy-target onclick="adminAddMatch()">Agregar partido</button>
    </div>
    ${matchAdminHtml}
  `;
}

  return `
    <div class="section-title" style="margin-top:0;">Mi Perfil</div>
    <div class="card">
      <div class="field"><label>Nombre</label><input type="text" id="profile-name" value="${esc(state.profile ? state.profile.name : '')}"></div>

        <label>Foto de perfil</label>
